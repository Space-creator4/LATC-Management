<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none" role="img" aria-label="">
  <title>Latitude ATC</title>
  <desc>Light aviation chart motif: sector grid, radar rings, navigation fixes and dashed flight paths.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1665c1" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="192" height="192" patternUnits="userSpaceOnUse">
      <path d="M192 0H0V192" stroke="#1665c1" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="62%" cy="34%" r="62%">
      <stop offset="0" stop-color="#2a7de1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2a7de1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-major)"/>
  <rect width="1200" height="800" fill="url(#wash)"/>

  <!-- Radar sweep centred on the sector -->
  <g transform="translate(760 372)" stroke="#1665c1" fill="none">
    <circle r="70" stroke-opacity=".28"/>
    <circle r="140" stroke-opacity=".20"/>
    <circle r="210" stroke-opacity=".14"/>
    <circle r="280" stroke-opacity=".09"/>
    <path d="M-300 0H300M0-300V300" stroke-opacity=".14" stroke-dasharray="6 10"/>
    <path d="M0 0 0-280" stroke-opacity=".22" stroke-width="2"/>
    <path d="M-198 198 198-198" stroke-opacity=".08"/>
    <path d="M-198-198 198 198" stroke-opacity=".08"/>
  </g>

  <!-- Concentric airspace rings offset left -->
  <g transform="translate(178 640)" stroke="#1665c1" fill="none" stroke-opacity=".10">
    <circle r="120"/>
    <circle r="200"/>
    <circle r="290"/>
  </g>

  <!-- Arrival and departure corridors -->
  <g stroke="#1665c1" fill="none" stroke-opacity=".20">
    <path d="M-40 690C220 640 420 520 618 428S840 320 1260 250" stroke-dasharray="10 12"/>
    <path d="M-40 470C260 486 470 452 700 404S1000 344 1260 336" stroke-dasharray="10 12" stroke-opacity=".14"/>
    <path d="M60 300C300 336 520 330 742 372S1020 452 1260 470" stroke-dasharray="10 12" stroke-opacity=".14"/>
  </g>

  <!-- Navigation fixes -->
  <g fill="#1665c1" fill-opacity=".30">
    <circle cx="618" cy="428" r="4"/>
    <circle cx="700" cy="404" r="4" fill-opacity=".22"/>
    <circle cx="520" cy="330" r="4" fill-opacity=".18"/>
    <circle cx="742" cy="372" r="4" fill-opacity=".22"/>
    <circle cx="420" cy="520" r="4" fill-opacity=".14"/>
    <circle cx="220" cy="640" r="4" fill-opacity=".14"/>
  </g>

  <g fill="#1665c1" fill-opacity=".34" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.4">
    <text x="628" y="424">LATC</text>
    <text x="712" y="400" fill-opacity=".22">FIX A</text>
    <text x="532" y="326" fill-opacity=".18">FIX B</text>
    <text x="754" y="368" fill-opacity=".22">FIX C</text>
  </g>

  <!-- Runway / taxiway stylisation -->
  <g stroke="#1665c1" fill="none" stroke-opacity=".18">
    <path d="M930 596h180" stroke-width="3"/>
    <path d="M944 574h152" stroke-width="1.5" stroke-dasharray="12 12"/>
    <path d="M120 620h132" stroke-width="3" stroke-opacity=".12"/>
    <path d="M134 600h104" stroke-width="1.5" stroke-dasharray="12 12" stroke-opacity=".12"/>
  </g>

  <!-- Aircraft silhouettes -->
  <g fill="#1665c1" fill-opacity=".16" transform="rotate(38 470 470)">
    <rect x="464" y="440" width="12" height="60" rx="6"/>
    <path d="M466 464 436 484v7l30-9zM474 464l30 20v7l-30-9zM467 496l-13 8v4l13-4zM473 496l13 8v4l-13-4z"/>
  </g>
  <g fill="#1665c1" fill-opacity=".11" transform="rotate(12 860 500)">
    <rect x="855" y="474" width="10" height="52" rx="5"/>
    <path d="M856 494 830 512v6l26-8zM864 494l26 18v6l-26-8zM857 522l-11 7v4l11-4zM863 522l11 7v4l-11-4z"/>
  </g>

  <!-- Altitude band ticks -->
  <g stroke="#1665c1" stroke-opacity=".16">
    <path d="M60 120h48M84 96v48"/>
    <path d="M1128 660h-48M1104 636v48"/>
  </g>
</svg>