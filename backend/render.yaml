# Render blueprint for the Latitude ATC website API.
#
# The website is https://latcm.co.uk and is served as static files, so it is not
# part of this blueprint. This service only backs the interactive parts: sign in,
# applications, the join queue, and the radar.
#
# It also supervises the Discord bot, which lives in bot/ and runs as a child
# process of this same service. One service means one free instance: the API and
# the bot sleep and wake together, and a bot crash never costs the API.
#
# Secrets are deliberately absent. Set these in the Render dashboard under
# Environment, never in this file — it is committed.
#
#   DATABASE_URL              Neon connection string (the bot shares it)
#   DISCORD_CLIENT_ID         from the Discord developer portal
#   DISCORD_CLIENT_SECRET     from the Discord developer portal
#   DISCORD_BOT_TOKEN         the bot token; read by role checks AND passed to
#                             the bot child process (which calls it
#                             DISCORD_TOKEN — same value, two names)
#   DISCORD_GUILD_ID          the Latitude ATC server id (the bot calls this
#                             GUILD_ID)
#   PILOT_ROLE_ID             snowflake for the Pilot role
#   ATC_ROLE_ID               snowflake for the controller role
#   SESSION_SECRET            long random string; rotates every session out
#   PRIVATE_INVITE_URL        the private invite; never leaves the service
#   DISCORD_REDIRECT_URI      <service>/auth/discord/callback
#   STAFF_ROLE_ID             optional; staff badge
#
# Optional bot tuning, all with working defaults:
#   BOT_ENABLED=false         run the API without starting the bot
#   PYTHON_BIN=<path>         override interpreter discovery
#   APP_REVIEW_CHANNEL_ID    channel where the bot posts applications
#                            (Accept/Reject buttons); unset turns it off
#
# In the Discord portal, add that exact redirect URI to the OAuth2 settings. It
# points at this service, not at latcm.co.uk, because Discord calls it directly.

services:
  - type: web
    name: latc-website-api
    runtime: node
    plan: free
    region: oregon
    # The repo is a monorepo: the static site lives in Website/ and this API in
    # backend/, with no package.json at the top level. Without this, Render runs
    # buildCommand from the repo root and npm ci has nothing to install.
    # It also keeps Website/ edits from triggering an API deploy.
    rootDir: backend
    # Installs the API packages and the bot's Python packages.
    #
    # The interpreter search prefers bot/.venv when this command creates one,
    # because that is where discord.py and asyncpg end up. Render's images ship
    # python3-pip but not python3-venv, so if the venv cannot be made the
    # fallback installs with --break-system-packages, which Debian bookworm
    # requires because its system Python is marked externally managed.
    buildCommand: |
      npm ci &&
      {
        if python3 -m venv bot/.venv 2>/dev/null; then
          bot/.venv/bin/pip install -r bot/requirements.txt;
        else
          pip3 install --break-system-packages -r bot/requirements.txt ||
          pip3 install --break-system-packages --user -r bot/requirements.txt;
        fi
      }
    startCommand: npm start
    # Reports the API, and includes a `bot` field. A stopped bot does not fail
    # this check on purpose: it must not take the website API down with it.
    healthCheckPath: /health
    # autoDeployTrigger replaces the deprecated autoDeploy field.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The website origins, not this API's own origin. The first entry is where
      # Discord returns the browser after login.
      - key: ALLOWED_ORIGINS
        value: https://latcm.co.uk,https://www.latcm.co.uk
      - key: APPLICATIONS_STAFF_OPEN
        value: "false"
      - key: APPLICATIONS_ATC_REQUIRES_PILOT
        value: "true"
      - key: QUEUE_AUTO_APPROVE
        value: "true"
      # The bot starts by default. Set to "false" to keep the API up while the
      # bot is deliberately offline.
      - key: BOT_ENABLED
        value: "true"
      # Channel where application reviews (Accept/Reject buttons) are posted.
      - key: APP_REVIEW_CHANNEL_ID
        value: "1554586623096786994"
