# Render blueprint for the Latitude ATC website API.
#
# Secrets are deliberately absent. Set these in the Render dashboard under
# Environment, never in this file — it is committed.
#
#   DATABASE_URL              Neon connection string (reuse the bot's)
#   DISCORD_CLIENT_ID         from the Discord developer portal
#   DISCORD_CLIENT_SECRET     from the Discord developer portal
#   DISCORD_BOT_TOKEN         the bot token, used only to read guild roles
#   DISCORD_GUILD_ID          the Latitude ATC server id
#   PILOT_ROLE_ID             snowflake for the Pilot role
#   ATC_ROLE_ID               snowflake for the controller role
#   SESSION_SECRET            long random string; rotates every session out
#   PRIVATE_INVITE_URL        the private invite; never leaves the service
#   ALLOWED_ORIGINS           the website origin, comma separated
#   DISCORD_REDIRECT_URI      <service>/auth/discord/callback
#
# In the Discord portal, add that exact redirect URI to the OAuth2 settings.

services:
  - type: web
    name: latc-website-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APPLICATIONS_STAFF_OPEN
        value: "false"
      - key: APPLICATIONS_ATC_REQUIRES_PILOT
        value: "true"
      - key: QUEUE_AUTO_APPROVE
        value: "true"
